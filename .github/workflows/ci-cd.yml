# CI/CD: build + run the test suite on every push and pull request;
# on merges to main, deploy the JAR to the VPS over SSH and restart the systemd service.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   VPS_HOST         VPS IP or hostname
#   VPS_USER         deploy user on the VPS (created by deploy/setup-vps.sh)
#   VPS_SSH_KEY      private key whose public key is in the deploy user's authorized_keys
#   VPS_KNOWN_HOSTS  output of `ssh-keyscan -p <port> <host>`
# Optional repository variable:
#   VPS_PORT         SSH port (default 22)

name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run tests
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

      - name: Upload JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    # Never run two deploys against the VPS at the same time
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}

    steps:
      # Skip (with a warning) until the VPS secrets exist; fail if only some of them are set
      - name: Check deploy secrets
        id: secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          missing=()
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -eq 4 ]; then
            echo "::warning::Deploy skipped: VPS secrets are not configured in the 'production' environment"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing deploy secrets: ${missing[*]}"
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.configured == 'true'

      - name: Download JAR
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: dist

      - name: Configure SSH
        if: steps.secrets.outputs.configured == 'true'
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts

      - name: Upload JAR to VPS
        if: steps.secrets.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          JAR="$(ls dist/*.jar)"
          scp -i ~/.ssh/id_deploy -P "$VPS_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$JAR" "$VPS_USER@$VPS_HOST:/opt/ticket-booking/releases/app-${GITHUB_SHA}.jar"

      # deploy.sh swaps the JAR, restarts the systemd service, waits for the health check
      # and rolls back to the previous JAR if the new one never becomes healthy.
      - name: Restart service
        if: steps.secrets.outputs.configured == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "bash -s -- '/opt/ticket-booking/releases/app-${GITHUB_SHA}.jar'" < deploy/deploy.sh

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
