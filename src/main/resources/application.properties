spring.application.name=ticketbooking

# =========================================================
# DATABASE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.sql.init.platform=postgresql
spring.jpa.defer-datasource-initialization=true


# =========================================================
# JWT
# =========================================================
ticketbooking.jwt.base64-secret=${JWT_SECRET:}

# 1 day
ticketbooking.jwt.access-token-validity-in-seconds=86400

# 100 days
ticketbooking.jwt.refresh-token-validity-in-seconds=8640000


# =========================================================
# FILE UPLOAD
# =========================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.data.web.pageable.one-indexed-parameters=true


# =========================================================
# CLOUDINARY
# =========================================================
cloudinary.url=${CLOUDINARY_URL:}


# =========================================================
# H2
# =========================================================
spring.h2.console.enabled=false


# =========================================================
# SERVER
# Local: 8081
# Render: automatically uses PORT
# =========================================================
server.port=${PORT:8081}


# =========================================================
# MAIL
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# =========================================================
# VNPAY
# =========================================================
vnpay.tmnCode=${VNPAY_TMN_CODE:}
vnpay.hashSecret=${VNPAY_HASH_SECRET:}

vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html

# Local defaults; override these on Render
vnpay.returnUrl=${VNPAY_RETURN_URL:http://localhost:8081/api/v1/payments/vnpay/callback}

vnpay.directUrlSuccess=${PAYMENT_SUCCESS_URL:http://localhost:5173/payment-success}

vnpay.directUrlError=${PAYMENT_ERROR_URL:http://localhost:5173/payment-error}

vnpay.version=2.1.0
vnpay.command=pay


# =========================================================
# MOMO
# =========================================================
momo.partnerCode=${MOMO_PARTNER_CODE:}
momo.accessKey=${MOMO_ACCESS_KEY:}
momo.secretKey=${MOMO_SECRET_KEY:}

momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create

# Local defaults; override these on Render
momo.returnUrl=${MOMO_RETURN_URL:http://localhost:8081/api/v1/payments/momo/callback}

momo.notifyUrl=${MOMO_NOTIFY_URL:http://localhost:8081/api/v1/payments/momo/notify}


# =========================================================
# GEMINI
# =========================================================
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}