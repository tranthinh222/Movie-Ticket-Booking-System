spring.application.name=ticketbooking

#config database
###
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql: true
###

###
#config jwt
ticketbooking.jwt.base64-secret=${JWT_SECRET:}
#expiration : 1 day (seconds = 25 * 60 * 60)
ticketbooking.jwt.access-token-validity-in-seconds=86400
ticketbooking.jwt.refresh-token-validity-in-seconds=8640000
#
###

#config upload file
###
#default = 1MB
spring.servlet.multipart.max-file-size=50MB

#default = 10 MB (form data)
spring.servlet.multipart.max-request-size=50MB
###
spring.data.web.pageable.one-indexed-parameters=true

#cloudinary
cloudinary.url=${CLOUDINARY_URL:}

#enable the H2 console
spring.h2.console.enabled=false
spring.sql.init.platform=postgresql

spring.jpa.defer-datasource-initialization=true

# server port
server.port=8081

#mail service
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

#VNPay Configuration
vnpay.tmnCode=${VNPAY_TMN_CODE:}
vnpay.hashSecret=${VNPAY_HASH_SECRET:}
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:8081/api/v1/payments/vnpay/callback
vnpay.directUrlSuccess=http://localhost:5173/payment-success
vnpay.directUrlError=http://localhost:5173/payment-error
vnpay.version=2.1.0
vnpay.command=pay

#Momo Configuration
momo.partnerCode=${MOMO_PARTNER_CODE:}
momo.accessKey=${MOMO_ACCESS_KEY:}
momo.secretKey=${MOMO_SECRET_KEY:}
momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
momo.returnUrl=http://localhost:8081/api/v1/payments/momo/callback
momo.notifyUrl=http://localhost:8081/api/v1/payments/momo/notify
# Default local development profile; override with spring.profiles.active for deployment.
spring.profiles.default=local

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:}
